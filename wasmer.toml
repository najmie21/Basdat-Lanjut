[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
env = [
    "LOG_CHANNEL=stderr",
    "SESSION_DRIVER=cookie",
    "CACHE_STORE=array",
    "VIEW_COMPILED_PATH=/tmp"
]